name: 'Schema Guard'
description: 'Detect schema changes in PRs and warn about documented/sensitive column impacts.'
inputs:
  context-path:
    description: 'Path to context.yaml'
    required: false
    default: './context.yaml'
  dsn:
    description: 'MySQL DSN. If omitted, an ephemeral MySQL container is used.'
    required: false
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
  before-migrations:
    description: 'Path to base-branch migrations directory'
    required: false
    default: ''
  after-migrations:
    description: 'Path to PR-branch migrations directory'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'cmd/schema-guard/Dockerfile'
