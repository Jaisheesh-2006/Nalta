version: "1"

# Healthcare domain — Synthea synthetic patient data
# This context.yaml documents the Synthea schema.
# Columns are flagged with:
#   sensitive: true  → business/clinical confidential (AI agents must not reveal raw values)
#   pii: true        → personally identifiable information (GDPR/HIPAA applies)

tables:

  patients:
    description: "Synthetic patient demographic records generated by Synthea. Each row is one unique patient with their full lifetime profile."
    columns:
      Id:
        description: "UUID uniquely identifying the patient. Used as a foreign key in all clinical tables."
      BIRTHDATE:
        description: "Patient's date of birth."
        pii: true
      DEATHDATE:
        description: "Date of death if the patient is deceased. NULL means the patient is alive."
      SSN:
        description: "Social Security Number. Synthetic but structurally valid."
        pii: true
      DRIVERS:
        description: "Driver's license number."
        pii: true
      PASSPORT:
        description: "Passport number."
        pii: true
      PREFIX:
        description: "Name prefix (Mr., Mrs., Dr., etc.)."
        pii: true
      FIRST:
        description: "Patient's first (given) name."
        pii: true
      LAST:
        description: "Patient's last (family) name."
        pii: true
      SUFFIX:
        description: "Name suffix (Jr., Sr., etc.)."
        pii: true
      MAIDEN:
        description: "Maiden name if applicable."
        pii: true
      MARITAL:
        description: "Marital status code: M = married, S = single."
      RACE:
        description: "Patient's self-reported race category."
      ETHNICITY:
        description: "Patient's self-reported ethnicity."
      GENDER:
        description: "Biological sex: M or F."
      BIRTHPLACE:
        description: "City and country of birth."
        pii: true
      ADDRESS:
        description: "Patient's current home street address."
        pii: true
      CITY:
        description: "City of residence."
        pii: true
      STATE:
        description: "US state of residence."
      COUNTY:
        description: "US county of residence."
      ZIP:
        description: "Postal ZIP code."
        pii: true
      LAT:
        description: "Geographic latitude of residence. Can be used to identify individuals when combined with other fields."
        pii: true
      LON:
        description: "Geographic longitude of residence. Can be used to identify individuals when combined with other fields."
        pii: true
      HEALTHCARE_EXPENSES:
        description: "Total lifetime out-of-pocket medical expenses in USD."
        sensitive: true
      HEALTHCARE_COVERAGE:
        description: "Total lifetime amount covered by insurance in USD."
        sensitive: true

  conditions:
    description: "Medical conditions or diagnoses recorded for each patient. A patient may have multiple conditions over time. Uses SNOMED CT codes."
    columns:
      START:
        description: "Date the condition was first recorded or diagnosed."
      STOP:
        description: "Date the condition was resolved. NULL means the condition is ongoing."
      PATIENT:
        description: "FK → patients.Id. The patient who has this condition."
      ENCOUNTER:
        description: "FK → encounters.Id. The clinical encounter during which this condition was recorded."
      CODE:
        description: "SNOMED CT clinical code identifying the condition."
      DESCRIPTION:
        description: "Human-readable name of the condition (e.g., 'Hypertension', 'Type 2 diabetes mellitus'). This is a clinical diagnosis — treat as sensitive."
        sensitive: true

  medications:
    description: "Medications prescribed or dispensed to patients. Includes cost data and reason for prescription. Uses RxNorm codes."
    columns:
      START:
        description: "Date the medication was started or prescribed."
      STOP:
        description: "Date the medication was stopped. NULL means still active."
      PATIENT:
        description: "FK → patients.Id."
      PAYER:
        description: "UUID of the insurance payer who covered part of the cost."
      ENCOUNTER:
        description: "FK → encounters.Id. Encounter during which this was prescribed."
      CODE:
        description: "RxNorm medication code."
      DESCRIPTION:
        description: "Name of the medication (e.g., 'Amoxicillin 250 MG'). May reveal underlying conditions."
        sensitive: true
      BASE_COST:
        description: "Standard list price of the medication before insurance, in USD."
        sensitive: true
      PAYER_COVERAGE:
        description: "Amount covered by the insurance payer in USD."
        sensitive: true
      DISPENSES:
        description: "Number of times the medication was dispensed / refilled."
      TOTALCOST:
        description: "Total cost of all dispenses combined, in USD."
        sensitive: true
      REASONCODE:
        description: "SNOMED CT code for the condition that prompted this medication."
      REASONDESCRIPTION:
        description: "Human-readable reason for prescribing this medication. May reveal diagnosis."
        sensitive: true

  encounters:
    description: "Clinical encounters (visits, hospital stays, emergency visits, etc.) between patients and providers."
    columns:
      Id:
        description: "UUID uniquely identifying this encounter."
      START:
        description: "Datetime when the encounter began."
      STOP:
        description: "Datetime when the encounter ended."
      PATIENT:
        description: "FK → patients.Id."
      ORGANIZATION:
        description: "UUID of the healthcare organization where the encounter took place."
      PROVIDER:
        description: "UUID of the specific clinician or provider."
      PAYER:
        description: "UUID of the insurance payer."
      ENCOUNTERCLASS:
        description: "Category of encounter: ambulatory, emergency, inpatient, wellness, urgentcare, outpatient."
      CODE:
        description: "SNOMED CT code for the type of encounter."
      DESCRIPTION:
        description: "Description of the encounter type (e.g., 'Emergency Room Admission')."
      BASE_ENCOUNTER_COST:
        description: "Base cost of the encounter before insurance, in USD."
        sensitive: true
      TOTAL_CLAIM_COST:
        description: "Total amount billed for this encounter, in USD."
        sensitive: true
      PAYER_COVERAGE:
        description: "Amount covered by insurance for this encounter, in USD."
        sensitive: true
      REASONCODE:
        description: "SNOMED CT code for the primary reason for this encounter."
      REASONDESCRIPTION:
        description: "Human-readable primary reason for the encounter. May reveal clinical history."
        sensitive: true

  observations:
    description: "Clinical observations, lab results, and vital signs recorded during encounters. Uses LOINC codes. This is the most granular clinical data table."
    columns:
      DATE:
        description: "Datetime when the observation was recorded."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      CODE:
        description: "LOINC code identifying the type of observation (e.g., 8302-2 = Body Height, 2345-7 = Blood Glucose)."
      DESCRIPTION:
        description: "Human-readable name of what was observed or measured (e.g., 'Body Height', 'Blood Pressure')."
      VALUE:
        description: "The actual measured or recorded value (e.g., '193.3', 'Negative'). Raw clinical result — treat as sensitive."
        sensitive: true
      UNITS:
        description: "Unit of measurement (e.g., 'cm', 'mmHg', 'mg/dL')."
      TYPE:
        description: "Data type of VALUE: 'numeric', 'text', or 'date'."

  procedures:
    description: "Medical procedures performed on patients during encounters. Uses SNOMED CT codes."
    columns:
      DATE:
        description: "Date the procedure was performed."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      CODE:
        description: "SNOMED CT code for the procedure."
      DESCRIPTION:
        description: "Name of the procedure (e.g., 'Colonoscopy', 'MRI of brain'). May reveal sensitive clinical history."
        sensitive: true
      BASE_COST:
        description: "Base cost of this procedure before insurance, in USD."
        sensitive: true
      REASONCODE:
        description: "SNOMED CT code for why this procedure was performed."
      REASONDESCRIPTION:
        description: "Human-readable reason this procedure was performed."
        sensitive: true

  allergies:
    description: "Allergies and intolerances recorded for patients. Uses SNOMED CT codes."
    columns:
      START:
        description: "Date the allergy was first recorded."
      STOP:
        description: "Date the allergy was resolved or removed. NULL means still active."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id. Encounter during which the allergy was recorded."
      CODE:
        description: "SNOMED CT code identifying the allergen or allergy type."
      DESCRIPTION:
        description: "Human-readable name of the allergy (e.g., 'Allergy to peanuts'). Reveals clinical history."
        sensitive: true

  careplans:
    description: "Care plans assigned to patients, outlining goals and recommended activities. Uses SNOMED CT codes."
    columns:
      Id:
        description: "UUID uniquely identifying this care plan."
      START:
        description: "Date the care plan began."
      STOP:
        description: "Date the care plan ended. NULL means still active."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      CODE:
        description: "SNOMED CT code for the care plan type."
      DESCRIPTION:
        description: "Name of the care plan (e.g., 'Diabetes self-management plan')."
        sensitive: true
      REASONCODE:
        description: "SNOMED CT code for the condition driving this care plan."
      REASONDESCRIPTION:
        description: "Human-readable reason the care plan was prescribed. May reveal diagnosis."
        sensitive: true

  devices:
    description: "Medical devices implanted or used by patients (e.g., pacemakers, insulin pumps). Uses SNOMED CT codes."
    columns:
      START:
        description: "Datetime when the device was first used or implanted."
      STOP:
        description: "Datetime when the device was removed or deactivated. NULL means still in use."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      CODE:
        description: "SNOMED CT code for the device type."
      DESCRIPTION:
        description: "Human-readable name of the device (e.g., 'Implantable cardiac pacemaker'). Reveals clinical history."
        sensitive: true
      UDI:
        description: "Unique Device Identifier (FDA UDI). Globally unique identifier for the physical device."
        sensitive: true

  imaging_studies:
    description: "Radiological and imaging studies performed on patients (X-ray, MRI, CT, etc.)."
    columns:
      Id:
        description: "UUID uniquely identifying this imaging study."
      DATE:
        description: "Datetime the imaging study was performed."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      BODYSITE_CODE:
        description: "SNOMED CT code for the body site imaged."
      BODYSITE_DESCRIPTION:
        description: "Human-readable body site (e.g., 'Thoracic structure'). May reveal clinical concern."
        sensitive: true
      MODALITY_CODE:
        description: "DICOM modality code for the imaging method (e.g., DX = Digital Radiography, MR = MRI)."
      MODALITY_DESCRIPTION:
        description: "Human-readable imaging modality (e.g., 'Digital Radiography', 'Magnetic Resonance Imaging')."
      SOP_CODE:
        description: "DICOM SOP class code identifying the type of image produced."
      SOP_DESCRIPTION:
        description: "Human-readable description of the image type produced by the study."

  immunizations:
    description: "Vaccinations and immunizations administered to patients. Uses CVX codes."
    columns:
      DATE:
        description: "Datetime the immunization was administered."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      CODE:
        description: "CVX code identifying the vaccine administered."
      DESCRIPTION:
        description: "Name of the vaccine (e.g., 'Influenza seasonal injectable preservative free')."
      BASE_COST:
        description: "Base cost of administering the immunization in USD."
        sensitive: true

  organizations:
    description: "Healthcare organizations and facilities where encounters take place (hospitals, clinics, etc.)."
    columns:
      Id:
        description: "UUID uniquely identifying the organization."
      NAME:
        description: "Legal name of the healthcare organization."
      ADDRESS:
        description: "Street address of the organization."
      CITY:
        description: "City where the organization is located."
      STATE:
        description: "US state where the organization is located."
      ZIP:
        description: "Postal ZIP code of the organization."
      LAT:
        description: "Geographic latitude of the organization."
      LON:
        description: "Geographic longitude of the organization."
      PHONE:
        description: "Contact phone number of the organization."
      REVENUE:
        description: "Total revenue of the organization in USD."
        sensitive: true
      UTILIZATION:
        description: "Total number of encounters performed at this organization."

  payers:
    description: "Insurance payers (health plans) that cover patient costs. Includes financial performance metrics."
    columns:
      Id:
        description: "UUID uniquely identifying the insurance payer."
      NAME:
        description: "Name of the insurance plan (e.g., 'Medicare', 'Blue Cross Blue Shield')."
      ADDRESS:
        description: "Street address of the payer's headquarters."
      CITY:
        description: "City of the payer's headquarters."
      STATE_HEADQUARTERED:
        description: "US state where the payer is headquartered."
      ZIP:
        description: "ZIP code of the payer."
      PHONE:
        description: "Contact phone number of the payer."
      AMOUNT_COVERED:
        description: "Total amount covered by this payer across all members, in USD."
        sensitive: true
      AMOUNT_UNCOVERED:
        description: "Total amount not covered (patient out-of-pocket), in USD."
        sensitive: true
      REVENUE:
        description: "Total revenue of the payer in USD."
        sensitive: true
      COVERED_ENCOUNTERS:
        description: "Total number of encounters covered by this payer."
      UNCOVERED_ENCOUNTERS:
        description: "Total number of encounters not covered by this payer."
      COVERED_MEDICATIONS:
        description: "Total number of medication claims covered."
      UNCOVERED_MEDICATIONS:
        description: "Total number of medication claims not covered."
      COVERED_PROCEDURES:
        description: "Total number of procedure claims covered."
      UNCOVERED_PROCEDURES:
        description: "Total number of procedure claims not covered."
      COVERED_IMMUNIZATIONS:
        description: "Total number of immunization claims covered."
      UNCOVERED_IMMUNIZATIONS:
        description: "Total number of immunization claims not covered."
      UNIQUE_CUSTOMERS:
        description: "Total number of unique patients enrolled with this payer."
      QOLS_AVG:
        description: "Average Quality of Life Score (QOLS) across all members. A synthetic metric."
        sensitive: true
      MEMBER_MONTHS:
        description: "Total member-months of coverage provided by this payer."

  payer_transitions:
    description: "Records of patients switching insurance payers over time. Captures insurance history."
    columns:
      PATIENT:
        description: "FK → patients.Id."
      START_YEAR:
        description: "Year this payer coverage began for the patient."
      END_YEAR:
        description: "Year this payer coverage ended for the patient."
      PAYER:
        description: "FK → payers.Id. The insurance payer during this period."
      OWNERSHIP:
        description: "Who owns the insurance policy: 'Self', 'Spouse', 'Guardian', etc."

  providers:
    description: "Individual healthcare providers and clinicians attached to organizations."
    columns:
      Id:
        description: "UUID uniquely identifying this provider."
      ORGANIZATION:
        description: "FK → organizations.Id. Organization this provider belongs to."
      NAME:
        description: "Full name of the provider."
        pii: true
      GENDER:
        description: "Provider's gender: M or F."
      SPECIALITY:
        description: "Medical specialty of the provider (e.g., 'GENERAL PRACTICE', 'CARDIOLOGY')."
      ADDRESS:
        description: "Street address of the provider's practice."
      CITY:
        description: "City of the provider's practice."
      STATE:
        description: "US state of the provider's practice."
      ZIP:
        description: "ZIP code of the provider's practice."
      LAT:
        description: "Geographic latitude of the provider."
      LON:
        description: "Geographic longitude of the provider."
      UTILIZATION:
        description: "Total number of encounters this provider has conducted."

  supplies:
    description: "Medical supplies used during patient encounters (e.g., bandages, syringes). Often empty in small datasets."
    columns:
      DATE:
        description: "Date the supply was used."
      PATIENT:
        description: "FK → patients.Id."
      ENCOUNTER:
        description: "FK → encounters.Id."
      CODE:
        description: "SNOMED CT code for the supply item."
      DESCRIPTION:
        description: "Human-readable name of the supply item."
      QUANTITY:
        description: "Number of units of this supply used."
