name: Schema Guard

on:
  pull_request:
    paths:
      - 'examples/synthea/migrations/**'   # fixed: was 'migrations/**' — that path doesn't exist

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build schema-guard
        run: go build -o schema-guard ./action

      - name: Run schema guard
        run: |
          ./schema-guard \
            --context ./examples/synthea/context.yaml \
            --dry-run
