name: Schema Guard

on:
  pull_request:
    paths:
      - 'examples/synthea/migrations/**'
      - 'migrations/**'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build schema-guard
        run: go build -o schema-guard ./cmd/schema-guard

      # Prepare before-migrations from the base branch
      - name: Checkout base branch migrations
        run: |
          mkdir -p /tmp/base-migrations
          git cat-file -e "origin/${{ github.base_ref }}:examples/synthea/migrations" 2>/dev/null && \
            git archive origin/${{ github.base_ref }} -- examples/synthea/migrations/ | \
            tar -x --strip-components=3 -C /tmp/base-migrations || \
            echo "No base migrations found — treating as greenfield"

      # NOTE: --dry-run prints the diff report to stdout instead of posting a GitHub PR comment.
      # This is intentional for CI validation — it verifies the diff logic runs without error.
      # To enable live PR commenting, remove --dry-run and ensure GITHUB_TOKEN has write:pull-requests scope.
      # See docs/ci_secrets.md for the full secret configuration guide.
      - name: Run schema guard (dry-run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./schema-guard \
            --before-migrations /tmp/base-migrations \
            --after-migrations ./examples/synthea/migrations \
            --context ./examples/synthea/context.yaml \
            --dry-run
